<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>小 A · 平板上的 AI 助手</title>
<style>
  :root {
    --bg:#d4d0c8; --panel:#dcd9d2; --panel2:#e8e5de; --code:#ffffff;
    --border:#a9a49a; --border2:#857f76;
    --text:#1a1a1a; --muted:#5c574e; --title:#0a246a; --body:#2b2b2b;
    --green:#1a7d37; --blue:#0b4ea2; --red:#c0392b; --chip:#d4d0c8; --chip-ink:#1a1a1a;
    --btn-hi:#ffffff; --btn-lo:#6e6a62;
    --shadow:0 2px 8px rgba(0,0,0,.25);
    --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  }
  [data-theme="dark"] {
    --bg:#0f1420; --panel:#151c2e; --panel2:#121828; --code:#0a0e18;
    --border:#26304a; --border2:#34406a;
    --text:#e6e9f0; --muted:#8b96b0; --title:#c9d4ee; --body:#b9c4dc;
    --green:#2fbf71; --blue:#5ecbff; --red:#ff8080; --chip:#1c2438; --chip-ink:#aeb8cf;
    --btn-hi:#3d4a6e; --btn-lo:#0a0e18;
    --shadow:0 3px 12px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding-bottom:12px; }

  header { display:flex; align-items:center; padding:10px 12px; gap:10px; background:var(--panel); border-bottom:2px solid var(--border2); position:sticky; top:0; z-index:10; }
  header .logo { width:34px; height:34px; border-radius:8px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; box-shadow:inset 0 -2px 0 rgba(0,0,0,.3); }
  header .t { flex:1; min-width:0; }
  header h1 { font-size:16px; margin:0; color:var(--title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .st { font-size:11px; color:var(--muted); margin-top:2px; }
  header .st b { font-weight:600; }
  .st-on { color:var(--green); } .st-off { color:var(--red); }
  .hbtn { border:1px solid var(--border2); background:linear-gradient(var(--btn-hi),var(--btn-lo)); border-radius:6px; width:34px; height:30px; font-size:14px; cursor:pointer; color:var(--text); }
  .hbtn:active { transform:translateY(1px); }

  #statusbar { display:flex; gap:6px; padding:8px 12px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  #statusbar .pill { border:1px solid var(--border); border-radius:10px; padding:2px 8px; background:var(--panel); }
  #statusbar .pill.on { color:var(--green); border-color:var(--green); }
  #statusbar .pill.off { color:var(--muted); }

  #chat { padding:0 12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:9px 12px; border-radius:12px; font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .msg.agent { align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-top-left-radius:3px; }
  .msg.user { align-self:flex-end; background:var(--blue); color:#fff; border-top-right-radius:3px; }
  .msg .src { display:block; font-size:10px; opacity:.65; margin-top:6px; font-family:var(--mono); }
  .typing { align-self:flex-start; color:var(--muted); font-size:13px; padding:4px 12px; display:none; }
  .typing.show { display:block; }

  #chips { display:flex; gap:8px; padding:10px 12px 4px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .chip { flex:0 0 auto; border:1px solid var(--border2); background:var(--chip); color:var(--chip-ink); border-radius:16px; padding:6px 13px; font-size:13px; cursor:pointer; }
  .chip:active { background:var(--border); }

  #inputbar { position:sticky; bottom:0; display:flex; gap:8px; padding:10px 12px; background:var(--panel); border-top:2px solid var(--border2); }
  #input { flex:1; border:1px solid var(--border2); border-radius:8px; padding:11px 12px; font-size:16px; background:var(--code); color:var(--text); font-family:inherit; }
  #input:focus { outline:2px solid var(--blue); outline-offset:-1px; }
  #send { border:1px solid var(--border2); background:linear-gradient(var(--btn-hi),var(--btn-lo)); border-radius:8px; padding:0 18px; font-size:15px; font-weight:600; color:var(--text); cursor:pointer; }
  #send:active { transform:translateY(1px); }

  #memPanel { display:none; margin:0 12px 10px; border:1px solid var(--border); background:var(--panel2); border-radius:8px; padding:10px 12px; font-size:13px; }
  #memPanel.show { display:block; }
  #memPanel h3 { margin:0 0 8px; font-size:13px; color:var(--title); }
  #memPanel .mrow { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--border); }
  #memPanel .mrow button { border:none; background:none; color:var(--red); cursor:pointer; font-size:12px; }
  #setPanel { display:none; margin:0 12px 10px; border:1px solid var(--border); background:var(--panel2); border-radius:8px; padding:10px 12px; font-size:13px; }
  #setPanel.show { display:block; }
  #setPanel h3 { margin:0 0 8px; font-size:13px; color:var(--title); }
  #setPanel .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  #setPanel input[type=password] { flex:1; min-width:200px; border:1px solid var(--border2); border-radius:6px; padding:8px 10px; font-size:14px; background:var(--code); color:var(--text); }
  #setPanel select { border:1px solid var(--border2); border-radius:6px; padding:8px; font-size:14px; background:var(--code); color:var(--text); }
  #setPanel .btn-mini2 { border:1px solid var(--border2); background:linear-gradient(var(--btn-hi),var(--btn-lo)); border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; color:var(--text); }
  #setPanel .hint { color:var(--muted); font-size:12px; line-height:1.6; }
  #setPanel .hint a { color:var(--blue); }
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div class="t">
    <h1>小 A · 平板上的 AI 助手</h1>
    <div class="st" id="netStat">正在探测在线能力…</div>
  </div>
  <button class="hbtn" id="themeBtn" title="切换深浅主题">🌙</button>
  <button class="hbtn" id="memBtn" title="查看我的记忆">🧠</button>
  <button class="hbtn" id="setBtn" title="大脑设置 / 接入大模型">⚙️</button>
</header>

<div id="statusbar"></div>

<div id="chat"></div>
<div class="typing" id="typing">小 A 正在想…</div>

<div id="chips">
  <button class="chip" data-q="你能做什么？">能力清单</button>
  <button class="chip" data-q="掷个骰子">🎲 掷骰子</button>
  <button class="chip" data-q="抛硬币">🪙 抛硬币</button>
  <button class="chip" data-q="今晚吃什么">🍚 今晚吃什么</button>
  <button class="chip" data-q="帮我抽签 去打球 打游戏 写代码">🎯 抽签</button>
  <button class="chip" data-q="算一下 (3+5)*8-16/4">🧮 算数</button>
  <button class="chip" data-q="查一下 火箭">📖 查百科</button>
  <button class="chip" data-q="北京天气怎么样">🌤 天气</button>
  <button class="chip" data-q="现在几点">🕐 报时</button>
  <button class="chip" data-q="3公里等于多少米">📏 换算</button>
</div>

<div id="memPanel"><h3>🧠 小 A 的记忆（存在这台平板里，不上传）</h3><div id="memList"></div></div>

<div id="setPanel">
  <h3>⚙️ 大脑设置</h3>
  <div class="row">
    <input id="msKey" type="password" placeholder="魔搭 API Key（只存在这台平板，不上传）">
    <select id="msModel">
      <option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5-7B（快，推荐）</option>
      <option value="Qwen/Qwen2.5-14B-Instruct">Qwen2.5-14B（更聪明）</option>
      <option value="Qwen/Qwen2.5-Coder-7B-Instruct">Qwen Coder（代码向）</option>
      <option value="deepseek-ai/DeepSeek-V3">DeepSeek-V3（最强，费额度）</option>
    </select>
    <button class="btn-mini2" id="msSave">保存</button>
    <button class="btn-mini2" id="msClear">清除</button>
  </div>
  <div class="hint" id="msStat"></div>
  <div class="hint">
    填了 Key，小 A 就换上真·大模型（通义 Qwen，能自己决定调工具：查天气/查百科/记事儿）。<br>
    Key 免费申请：<a href="https://modelscope.cn" target="_blank">modelscope.cn</a> 注册 → 绑定阿里云 → 右上角头像 → <b>访问令牌</b> → 创建（每天有免费额度）。<br>
    没填也能用：本地大脑（算数/记忆/掷骰子/换算）永不停机，公共 AI 网关能通时顶上。
  </div>
  <div class="row" style="margin-top:10px;border-top:1px dashed var(--border);padding-top:10px">
    <button class="btn-mini2" id="shareBtn">📤 复制网页链接</button>
    <a class="btn-mini2" href="https://github.com/Andy-hub-byte/C-plus-plus" target="_blank" style="text-decoration:none">⭐ 去 GitHub 给个 Star</a>
  </div>
</div>

<div id="inputbar">
  <input id="input" type="text" placeholder="跟小 A 说点什么…（Enter 发送）" autocomplete="off">
  <button id="send">发送</button>
</div>

<script>
'use strict';
/* ================= 小 A · 本地优先的平板 agent =================
   架构：本地 backbone（计算/记忆/随机/换算/时间）永远可用；
        在线增强（AI 对话/天气/百科）尽力而为，失败自动降级。 */
(function () {

  /* ---------- 主题 ---------- */
  var themeBtn = document.getElementById('themeBtn');
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('agent_theme'); } catch (e) {}
  if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  themeBtn.addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('agent_theme', dark ? 'light' : 'dark'); } catch (e) {}
  });

  /* ---------- 记忆（localStorage） ---------- */
  var MEM_KEY = 'agent_memory_v1';
  var mem = { name: '', facts: [] };
  try {
    var raw = localStorage.getItem(MEM_KEY);
    if (raw) { var p = JSON.parse(raw); if (p && typeof p === 'object') mem = p; }
  } catch (e) {}
  function memSave() { try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {} }
  function memRender() {
    var box = document.getElementById('memList');
    var rows = [];
    if (mem.name) rows.push({ k: '怎么称呼你', v: mem.name, tag: 'name' });
    mem.facts.forEach(function (f, i) { rows.push({ k: '备忘 #' + (i + 1), v: f, tag: 'fact' + i }); });
    if (!rows.length) { box.innerHTML = '<div style="color:var(--muted)">还没有记忆。对我说「记住我叫阿仓」试试。</div>'; return; }
    box.innerHTML = rows.map(function (r) {
      return '<div class="mrow"><span>' + esc(r.k) + '：' + esc(r.v) + '</span>' +
        '<button data-del="' + r.tag + '">删除</button></div>';
    }).join('');
    box.querySelectorAll('button[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tag = b.getAttribute('data-del');
        if (tag === 'name') mem.name = '';
        else if (tag.indexOf('fact') === 0) mem.facts.splice(+tag.slice(4), 1);
        memSave(); memRender();
        say('好，这条我忘了。');
      });
    });
  }
  document.getElementById('memBtn').addEventListener('click', function () {
    document.getElementById('memPanel').classList.toggle('show');
    if (document.getElementById('memPanel').classList.contains('show')) memRender();
  });

  /* ---------- 设置面板（魔搭 Key / 模型 / 分享） ---------- */
  var setPanel = document.getElementById('setPanel');
  var msKeyInput = document.getElementById('msKey');
  var msModelSel = document.getElementById('msModel');
  msKeyInput.value = msGetKey();
  msModelSel.value = msGetModel();
  function msStatText() {
    var has = !!msGetKey();
    document.getElementById('msStat').innerHTML = has
      ? '当前大脑：<b style="color:var(--green)">魔搭 ' + msGetModel() + '</b>（真大模型 + 工具调用）'
      : '当前大脑：<b>本地规则 + 公共网关</b>（填 Key 升级为真大模型）';
    return has;
  }
  document.getElementById('setBtn').addEventListener('click', function () {
    setPanel.classList.toggle('show');
    if (setPanel.classList.contains('show')) msStatText();
  });
  document.getElementById('msSave').addEventListener('click', function () {
    var k = msKeyInput.value.trim();
    try {
      if (k) { localStorage.setItem(MS_KEY, k); localStorage.setItem(MS_MODEL, msModelSel.value); }
      else { localStorage.removeItem(MS_KEY); }
    } catch (e) {}
    msStatText(); renderStatus();
    say(k ? '换脑完成！现在是魔搭 ' + msModelSel.value + '，我能自己决定调工具了。随便问点复杂的试试。' : 'Key 清空了，回到本地大脑 + 公共网关。', '系统');
  });
  document.getElementById('msClear').addEventListener('click', function () {
    msKeyInput.value = '';
    try { localStorage.removeItem(MS_KEY); } catch (e) {}
    msStatText(); renderStatus();
  });
  document.getElementById('shareBtn').addEventListener('click', function () {
    var url = location.href.split('#')[0];
    function ok() { say('链接已复制，发给别人就能打开：' + url, '系统'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(ok, function () { fallbackCopy(url); ok(); });
    } else { fallbackCopy(url); ok(); }
  });
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 短期记忆（最近几轮对话，localStorage 持久化） ---------- */
  var HIS_KEY = 'agent_history_v1';
  var history = [];
  try {
    var hraw = localStorage.getItem(HIS_KEY);
    if (hraw) { var hp = JSON.parse(hraw); if (Array.isArray(hp)) history = hp.slice(-8); }
  } catch (e) {}
  function hisPush(role, text) {
    history.push({ r: role, t: String(text).slice(0, 200) });
    if (history.length > 8) history = history.slice(-8);
    try { localStorage.setItem(HIS_KEY, JSON.stringify(history)); } catch (e) {}
  }
  /* 离线大脑也能引用短期记忆：问题里的关键词在历史里找找（跳过最后一条=当前这句） */
  function recallLocal(t) {
    var q = t.replace(/[?？。，,！!]|是什么|叫什么|什么|请问|帮我|一下/g, '').trim();
    if (q.length < 2) return null;
    for (var i = history.length - 2; i >= 0; i--) {
      if (history[i].r !== 'user') continue;
      var said = history[i].t;
      // 问题关键词（2字以上片段）出现在历史原话里
      for (var L = 2; L <= Math.min(6, q.length); L++) {
        for (var s = 0; s + L <= q.length; s++) {
          var frag = q.slice(s, s + L);
          if (frag.length >= 2 && said.indexOf(frag) !== -1) {
            return '你刚才说过：' + said;
          }
        }
      }
    }
    return null;
  }

  /* ---------- 聊天 UI ---------- */
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var typing = document.getElementById('typing');
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function bubble(text, who, src) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    d.innerHTML = esc(text) + (src ? '<span class="src">' + esc(src) + '</span>' : '');
    chat.appendChild(d);
    d.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return d;
  }
  function say(text, src) { bubble(text, 'agent', src || null); }

  /* ---------- fetch 统一封装：8 秒超时，绝不让请求挂死 ---------- */
  function fetchT(url, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms || 8000);
    return fetch(url, { method: 'GET', mode: 'cors', signal: ctrl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r; },
            function (e) { clearTimeout(timer); throw new Error(e.name === 'AbortError' ? '超时' : '网络不通'); });
  }

  /* ---------- 在线能力探测（不阻塞启动，只影响状态条） ---------- */
  var online = { ai: false, wiki: false, weather: false };
  var WMO = {
    0: '晴', 1: '大致晴', 2: '局部多云', 3: '阴', 45: '雾', 48: '冻雾',
    51: '毛毛雨', 53: '毛毛雨', 55: '浓毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨',
    66: '冻雨', 67: '强冻雨', 71: '小雪', 73: '中雪', 75: '大雪', 77: '雪粒',
    80: '阵雨', 81: '强阵雨', 82: '暴雨', 85: '阵雪', 86: '强阵雪',
    95: '雷暴', 96: '雷暴伴冰雹', 99: '强雷暴伴冰雹'
  };
  function renderStatus() {
    var brain = msGetKey() ? '魔搭 Qwen' : '本地+网关';
    document.getElementById('netStat').innerHTML =
      '在线能力：AI 对话 <b class="' + (online.ai ? 'st-on">✓' : 'st-off">✗') + '</b>' +
      ' · 天气 <b class="' + (online.weather ? 'st-on">✓' : 'st-off">✗') + '</b>' +
      ' · 百科 <b class="' + (online.wiki ? 'st-on">✓' : 'st-off">✗') + '</b>' +
      ' · 大脑 <b>' + brain + '</b>';
    var sb = document.getElementById('statusbar');
    sb.innerHTML =
      '<span class="pill ' + (online.ai ? 'on' : 'off') + '">AI 对话</span>' +
      '<span class="pill ' + (online.weather ? 'on' : 'off') + '">天气</span>' +
      '<span class="pill ' + (online.wiki ? 'on' : 'off') + '">百科</span>' +
      '<span class="pill on">计算/记忆/随机/换算</span>' +
      '<span class="pill on">大脑：' + brain + '</span>';
  }
  renderStatus();
  function probe(name, url, timeoutMs) {
    return new Promise(function (res) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; res(false); } }, timeoutMs || 6000);
      fetchT(url, timeoutMs || 6000).then(function (r) {
        return r.text();
      }).then(function () {
        if (!done) { done = true; clearTimeout(t); res(true); }
      }).catch(function () { if (!done) { done = true; clearTimeout(t); res(false); } });
    }).then(function (ok) { online[name] = ok; renderStatus(); });
  }
  // 探测要轻：AI 用最短 prompt；百科/天气用小查询
  probe('ai', 'https://text.pollinations.ai/hi', 8000);
  probe('wiki', 'https://zh.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles=%E7%81%AB%E7%AE%AD', 6000);
  probe('weather', 'https://api.open-meteo.com/v1/forecast?latitude=39.9&longitude=116.4&current=temperature_2m', 6000);

  /* ---------- 工具 1：计算器（自写递归下降，不 eval） ---------- */
  function calc(expr) {
    var s = String(expr)
      .replace(/^(?:请?帮我?|帮我?)?(?:算一下?|计算一下?|算算|计算|算)\s*/, '')
      .replace(/[×✕]/g, '*').replace(/[÷]/g, '/').replace(/，/g, ',')
      .replace(/等于多少|是多少|等于|结果|=?$/g, '');
    var i = 0;
    function ws() { while (i < s.length && s[i] === ' ') i++; }
    function peek() { ws(); return s[i]; }
    function num() {
      ws();
      var st = i;
      while (i < s.length && /[0-9.]/.test(s[i])) i++;
      if (st === i) throw new Error('缺数字');
      var v = parseFloat(s.slice(st, i));
      // 百分号：50% → 0.5
      if (s[i] === '%') { i++; v = v / 100; }
      return v;
    }
    function atom() {
      ws();
      if (s[i] === '(') { i++; var v = expr_(); ws(); if (s[i] !== ')') throw new Error('缺右括号'); i++; return v; }
      if (s[i] === '-') { i++; return -atom(); }
      if (s[i] === '+') { i++; return atom(); }
      var m = /^[a-zA-Z一-龥]+/.exec(s.slice(i));
      if (m) {
        var name = m[0]; i += name.length;
        ws(); if (s[i] === '(') i++; else throw new Error('函数要跟括号');
        var arg = expr_(); ws(); if (s[i] !== ')') throw new Error('缺右括号'); i++;
        return callFn(name.toLowerCase(), arg);
      }
      return num();
    }
    function callFn(name, a) {
      var r = a * Math.PI / 180;
      switch (name) {
        case 'sqrt': case '开根': return Math.sqrt(a);
        case 'abs': case '绝对值': return Math.abs(a);
        case 'round': case '四舍五入': return Math.round(a);

        case 'cos': return Math.cos(r);

  /* ---------- 工具 3：单位换算（本地表） ---------- */
  var UNITS = {
    len: { '米': 1, '千米': 1000, '公里': 1000, '厘米': 0.01, '毫米': 0.001, '英里': 1609.344, '英尺': 0.3048, '英寸': 0.0254, '码': 0.9144, '海里': 1852, '里': 500 },

    vol: { '升': 1, '毫升': 0.001, '立方米': 1000, '加仑': 3.78541, '品脱': 0.473176, '杯': 0.24 }

  function convert(t) {
    var m = /(-?[\d.]+)\s*([一-龥]+)\s*(?:等于|是多少|换成|换成多少|折合|等于多少|=)\s*(?:多少)?([一-龥]+)/.exec(t);

    var v = parseFloat(m[1]), from = m[2], to = m[3];
    for (var cat in UNITS) {
      var T = UNITS[cat];
      if (T[from] && T[to]) {
        var r = v * T[from] / T[to];
        r = Math.round(r * 1e6) / 1e6;
        return v + ' ' + from + ' = ' + r + ' ' + to;
      }

  }

    }
    m = /(-?[\d.]+)\s*(华氏度|℉|°F)\s*(?:等于|是多少|换成|转成?)\s*(?:多少)?(度|摄氏度|℃|°C)/.exec(t);
    if (m) {
